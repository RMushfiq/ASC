<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#FAFAF7;color:#24221D;line-height:1.5;padding:20px 16px 40px}
  .wrap{max-width:960px;margin:0 auto}
  header h1{font-size:1.45rem;font-weight:700}
  header p{color:#6B675E;font-size:.92rem;margin-top:2px}
  header .newtab{font-size:.8rem;color:#1B5CB8}
  .tabs{display:flex;gap:8px;margin:18px 0 14px;flex-wrap:wrap}
  .tab{border:1px solid #E3E0D8;background:#fff;border-radius:999px;padding:8px 18px;font-size:.92rem;font-weight:600;color:#4B473E;cursor:pointer}
  .tab.on{background:#FFC72C;border-color:#FFC72C;color:#24221D}
  .tab:hover:not(.on){border-color:#C9C5BA}
  .searchbar{position:relative}
  .searchbar input{width:100%;padding:13px 44px 13px 16px;font-size:1.02rem;border:1.5px solid #D9D5CC;border-radius:12px;background:#fff;outline:none}
  .searchbar input:focus{border-color:#FFC72C;box-shadow:0 0 0 3px rgba(255,199,44,.25)}
  .searchbar .x{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:#EFEDE6;color:#6B675E;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:.85rem;display:none}
  .meta{margin:16px 2px 10px;font-size:.88rem;color:#6B675E}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}
  .card{background:#fff;border:1px solid #E8E5DD;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .card h3{font-size:1.02rem;font-weight:700;margin-right:6px;display:inline}
  .badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;vertical-align:2px;white-space:nowrap}
  .b-ok{background:#E7F5EC;color:#0E7A3D}
  .b-ai{background:#FEF3C7;color:#92400E;font-weight:600}
  .b-cat{background:#EFEDE6;color:#4B473E;font-weight:600}
  .desc{font-size:.9rem;color:#4B473E;flex:1}
  .owners{font-size:.82rem;color:#6B675E;display:flex;flex-direction:column;gap:2px}
  .owners b{color:#4B473E;font-weight:600}
  .desc.pending{color:#8A8578;font-style:italic}
  .how{border-top:1px solid #F0EEE7;padding-top:10px;font-size:.86rem;color:#4B473E}
  .how .hlabel{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#8A8578;display:block;margin-bottom:3px}
  .how b{color:#24221D}
  .mchip{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:999px;margin-bottom:5px}
  .m-self{background:#E8F1FD;color:#1B5CB8}
  .m-ticket{background:#F3EFFB;color:#6B3FA0}
  .m-itops{background:#EFEDE6;color:#4B473E}
  .panel{background:#fff;border:1px solid #E8E5DD;border-radius:12px;padding:26px;text-align:center;color:#4B473E}
  .panel h2{font-size:1.1rem;margin-bottom:8px;color:#24221D}
  .panel.warn{border-left:5px solid #E4572E;text-align:left}
  .panel.warn h2{color:#B23A18}
  .panel.soon{border-left:5px solid #FFC72C;text-align:left}
  .panel button{margin-top:12px;border:0;background:#FFC72C;font-weight:700;padding:9px 20px;border-radius:999px;cursor:pointer;font-size:.9rem}
  .hint{margin-top:10px;font-size:.88rem}
  .hint a{color:#1B5CB8;cursor:pointer;text-decoration:underline}
  footer{margin-top:26px;font-size:.78rem;color:#9B968A;text-align:center}
  .spin{width:26px;height:26px;border:3px solid #EFEDE6;border-top-color:#FFC72C;border-radius:50%;margin:0 auto 10px;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
