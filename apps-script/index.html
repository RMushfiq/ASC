  .panel.warn h2{color:#B23A18}

  .spin{width:26px;height:26px;border:3px solid #EFEDE6;border-top-color:#FFC72C;border-radius:50%;margin:0 auto 10px;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

<body>
<div class="wrap">
  <header>
    <h1>Approved Software Catalog</h1>
    <p>Search PensionBee&rsquo;s approved apps and find out how to get them. Maintained by InfoSec &amp; IT Operations.
      <a class="newtab" href="<?= appUrl ?>" target="_blank" rel="noopener">Open in new tab &#8599;</a></p>

  <div class="tabs" id="tabs">

  <div class="searchbar">
    <input id="q" type="search" placeholder="Search by app name or what you need &mdash; e.g. &ldquo;PDF creator&rdquo;, &ldquo;video editing&rdquo;, &ldquo;Slack&rdquo;" autocomplete="off">

<script>
"use strict";
/* Data comes from Code.gs → getCatalog(key). Sheets are read server-side as the
   script owner, so no publish-to-web links, CORS or cookies are involved. */

/* Use-case tags (t) for fuzzy search + AI-drafted descriptions (d) for gaps.
   A real description in the Sheet/Setyl always wins. Keys are version-stripped names. */
var ENRICH = {

  "cypress":{t:"testing qa automation web development end-to-end"},
  "filezilla":{t:"ftp sftp file transfer upload download"},

  "flux":{t:"screen eye strain display colour temperature wellbeing night"},

  "insomnia":{t:"api rest graphql testing development http client"},

  "mysqlworkbench":{t:"database sql mysql data admin",d:"A visual tool for designing, developing and administering MySQL databases."},
  "obs":{t:"streaming screen recording video recording broadcast"},

  "privileges":{t:"admin rights permissions elevation security"},
  "python":{t:"programming development scripting data coding language"},
  "python launcher":{t:"programming python scripting development"},
  "react native debugger":{t:"debugging development mobile react redux"},
  "rectangle":{t:"window management resize snap productivity shortcuts"},
  "rectangle pro":{t:"window management resize snap productivity shortcuts"},
  "rstudio":{t:"data analysis statistics r data science ide",d:"An integrated development environment for R, used for statistical analysis and data science."},
  "shottr":{t:"screenshot screen capture annotation markup"},

  "snowsql":{t:"database snowflake sql data warehouse command line"},

  "adobe acrobat":{t:"pdf creator pdf editor documents convert sign e-sign merge",d:"Adobe’s PDF tool for viewing, creating, editing, converting and signing PDF documents."},
  "adobe creative cloud":{t:"design photo editing video editing photoshop illustrator indesign premiere creative graphics",d:"Adobe’s creative suite including Photoshop, Illustrator, InDesign and Premiere Pro."},
  "arixcel explorer":{t:"excel spreadsheet auditing formulas finance"},

  "figma agent":{t:"design figma fonts ui prototyping"},

  "github desktop":{t:"git version control development github repositories code"},
  "google drive":{t:"file storage sync cloud storage files backup documents",d:"Google Drive for desktop — syncs your Drive files and Shared Drives to your computer."},
  "grammarly for windows":{t:"writing grammar spelling proofreading tone ai assistant",d:"An AI writing assistant that checks grammar, spelling and tone as you type across apps."},
  "greenshot":{t:"screenshot screen capture annotation markup"},

  "microsoft azure portal":{t:"cloud azure admin microsoft infrastructure"},

  "notepad++":{t:"text editor code editor coding development"},
  "npcap":{t:"network packet capture wireshark drivers"},
  "okta verify":{t:"mfa authentication 2fa security login two-factor",d:"Okta’s multi-factor authentication app used to verify your sign-ins."},
  "openrefine":{t:"data cleaning data transformation aws"},
  "papercut hive":{t:"printing printers print management",d:"Cloud print-management software for secure printing to office printers."},
  "qualys agent":{t:"security vulnerability scanning compliance monitoring",d:"A security agent that scans for vulnerabilities and monitors compliance, managed by IT Ops."},
  "screaming frog seo spider":{t:"seo website crawler marketing audit links metadata",d:"A website crawler for SEO auditing — links, metadata, redirects and site structure."},
  "screenconnect":{t:"remote support remote access it support screen sharing",d:"Remote-support tool IT Ops uses to securely connect to your device and help you."},
  "seo spider":{t:"seo website crawler marketing audit",d:"Screaming Frog’s website crawling tool for SEO analysis and auditing."},
  "suite msis for websigner barclays":{t:"banking barclays payments signing finance",d:"Barclays WebSigner components required for authorising Barclays online banking payments."},
  "wireshark":{t:"network analysis packet capture troubleshooting protocols",d:"A network protocol analyser for capturing and inspecting network traffic."},
  "zoom":{t:"video calls meetings conferencing webinar screen sharing",d:"Video-conferencing app for meetings, webinars and screen sharing."}
};

var KEYS = ["mac","win","setyl"];
var LABEL = {mac:"Mac", win:"Windows", setyl:"Sites & Apps"};
var CHIPS = ["PDF","Notetaker","Video editing","Screenshots","Browsers","Databases","AI"];

var state = {tab:"mac", q:"", cat:{}};
KEYS.forEach(function(k){state.cat[k]={status:"loading",apps:[],err:"",updated:null};});

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function stripVer(name){
  return name.toLowerCase().replace(/\([^)]*\)/g," ").split(/\s+/).filter(function(t){
    return t && !/^v?[\d.]+$/.test(t) && ["x64","x86","64-bit","32-bit"].indexOf(t)===-1;
  }).join(" ").trim();
}

/* rows: [name, install, description, category?, ...] — header row optional. */
function buildApps(rows){
  var apps=[], start=(rows.length && /application\s*name/i.test(rows[0][0]||""))?1:0;
  for(var i=start;i<rows.length;i++){
    var r=rows[i], name=String(r[0]||"").trim();
    if(!name) continue;
    var install=String(r[1]||"").trim(), desc=String(r[2]||"").trim(), cat=String(r[3]||"").trim();
    var e=ENRICH[name.toLowerCase()]||ENRICH[stripVer(name)]||{}, ai=false;
    if(!desc && e.d){desc=e.d;ai=true;}
    apps.push({name:name,install:install,desc:desc,ai:ai,cat:cat,
      hay:(name+" "+(e.t||"")+" "+cat+" "+desc).toLowerCase()});
  }
  apps.sort(function(a,b){return a.name.localeCompare(b.name);});
  return apps;
}

function load(key){
  state.cat[key]={status:"loading",apps:[],err:"",updated:null};
  render();
  google.script.run
    .withSuccessHandler(function(res){
      if(res && res.pending){state.cat[key]={status:"pending",apps:[],err:"",updated:null};}
      else{
        var apps=buildApps((res&&res.rows)||[]);
        state.cat[key]=apps.length?{status:"ok",apps:apps,err:"",updated:res.updated}
                                  :{status:"error",apps:[],err:"empty",updated:null};
      }
      render();
    })
    .withFailureHandler(function(err){
      state.cat[key]={status:"error",apps:[],err:String(err&&err.message||err),updated:null};
      render();
    })
    .getCatalog(key);
}

function singular(t){return t.length>3&&t.slice(-1)==="s"?t.slice(0,-1):t;}
function tokMatch(hay,t){
  if(t.length>2) return hay.indexOf(t)>-1;
  return new RegExp("(^|[^a-z0-9])"+t.replace(/[^a-z0-9]/g,"\\$&")+"($|[^a-z0-9])").test(hay);
}

function searchApps(q,apps){
  q=q.toLowerCase().trim();
  if(!q) return apps.slice();
  var tokens=q.split(/\s+/).filter(function(t){return /[a-z0-9]/.test(t);});
  if(!tokens.length) return apps.slice();
  var out=[];
  apps.forEach(function(a){
    var score=0, nm=a.name.toLowerCase();
    if(q.length>2?nm.indexOf(q)>-1:tokMatch(nm,q)) score=100;
    else if(tokens.every(function(t){return tokMatch(a.hay,t)||tokMatch(a.hay,singular(t));}))
      score=nm.indexOf(tokens[0])>-1?80:60;
    if(score) out.push({a:a,s:score});
  });
  out.sort(function(x,y){return y.s-x.s||x.a.name.localeCompare(y.a.name);});
  return out.map(function(o){return o.a;});
}

function howToGet(install,key){
  var s=(install||"").toLowerCase();
  if(key==="setyl")
    return {cls:"m-ticket",chip:"Request access",
      html:"Raise a <b>service-desk ticket in HappyFox</b> to request access — IT Ops will set you up (usually via Okta SSO)."};
  if(s.indexOf("self-service")>-1){
    var portal=key==="mac"?"Kandji Self Service":"Company Portal";
    return {cls:"m-self",chip:"Self-service",
      html:"Install it yourself: open the <b>"+portal+"</b> app on your "+(key==="mac"?"Mac":"Windows laptop")+" and hit install. No ticket needed."};
  }
  if(s.indexOf("service-desk")>-1)
    return {cls:"m-ticket",chip:"Service-desk ticket",
      html:"Raise a <b>service-desk ticket in HappyFox</b> with a short business justification — IT Ops will install it for you."};
  if(s.indexOf("provisioned")>-1)
    return {cls:"m-itops",chip:"Managed by IT Ops",
      html:"Comes pre-installed and managed by <b>IT Ops</b>. If it’s missing from your device, raise a service-desk ticket in HappyFox."};
  return {cls:"m-ticket",chip:install||"Ask IT Ops",
    html:"Raise a <b>service-desk ticket in HappyFox</b> and IT Ops will point you in the right direction."};
}

function cardHTML(a,key){
  var how=howToGet(a.install,key);
  var descHtml=a.desc
    ? '<div class="desc">'+esc(a.desc)+(a.ai?' <span class="badge b-ai">AI-drafted — needs InfoSec confirmation</span>':"")+"</div>"
    : '<div class="desc pending">Description pending InfoSec review.</div>';
  return '<div class="card"><div><h3>'+esc(a.name)+'</h3><span class="badge b-ok">✓ Approved</span>'
    +(a.cat?' <span class="badge b-cat">'+esc(a.cat)+"</span>":"")+"</div>"
    +descHtml
    +'<div class="how"><span class="hlabel">How to get it</span><span class="mchip '+how.cls+'">'+esc(how.chip)+"</span><div>"+how.html+"</div></div></div>";
}

function notApprovedHTML(q,key){
  var hints=KEYS.filter(function(k){return k!==key && state.cat[k].apps.length;}).map(function(k){
    var n=searchApps(q,state.cat[k].apps).length;
    return n?n+" match"+(n>1?"es":"")+' in <a data-jump="'+k+'">'+LABEL[k]+"</a>":"";
  }).filter(Boolean);
  return '<div class="panel warn"><h2>“'+esc(q)+"” isn’t in the approved "+LABEL[key]+" catalog</h2>"
    +"<p><b>Not approved — raise a Procurement request via HappyFox</b> with your business justification. "
    +"InfoSec will review it (SLA: 20 working days).</p>"
    +'<p class="hint">Please don’t install or sign up for unapproved software in the meantime — it counts as shadow IT.</p>'
    +(hints.length?'<p class="hint">By the way — '+hints.join(", ")+".</p>":"")+"</div>";
}

function render(){
  var tabs=document.querySelectorAll(".tab");
  for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle("on",tabs[i].dataset.tab===state.tab);
  var results=document.getElementById("results"), meta=document.getElementById("meta");
  document.getElementById("clear").style.display=state.q?"block":"none";

  var key=state.tab, cat=state.cat[key];
  meta.textContent="";
  if(cat.status==="loading"){
    results.innerHTML='<div class="panel"><div class="spin"></div>Loading the latest catalog…</div>';
  } else if(cat.status==="pending"){
    results.innerHTML='<div class="panel soon"><h2>Sites &amp; Apps — coming soon</h2>'
      +"<p>The Setyl register sync hasn’t run yet. Until then: to request access to a web app, raise a <b>service-desk ticket in HappyFox</b>; "
      +"to request something new, raise a <b>Procurement request via HappyFox</b>.</p></div>";
  } else if(cat.status==="error"){
    results.innerHTML='<div class="panel warn"><h2>Catalog data unavailable</h2>'
      +"<p>We couldn’t load the "+LABEL[key]+" catalog just now — please try again shortly. "
      +"If this keeps happening, let IT Ops know via a service-desk ticket.</p>"
      +'<button id="retry">Try again</button></div>';
    document.getElementById("retry").onclick=function(){load(key);};
  } else {
    var hits=searchApps(state.q,cat.apps);
    meta.textContent=!state.q
      ? cat.apps.length+" approved "+(key==="setyl"?"sites & apps":"apps in the "+LABEL[key]+" catalog")+" — search above or browse below."
      : (hits.length?hits.length+" approved "+(hits.length===1?"app matches":"apps match")+" “"+state.q+"” in "+LABEL[key]+".":"");
    if(state.q && !hits.length){
      results.innerHTML=notApprovedHTML(state.q,key);
      var jl=results.querySelectorAll("[data-jump]");
      for(var j=0;j<jl.length;j++) jl[j].onclick=function(){setTab(this.dataset.jump);};
    } else {
      results.innerHTML='<div class="grid">'+hits.map(function(a){return cardHTML(a,key);}).join("")+"</div>";
    }
  }
  renderFoot();
}

function renderFoot(){
  var c=state.cat[state.tab], txt;
  if(state.tab==="setyl"){
    txt="Synced daily from the Setyl Sites & Apps register"
      +(c.updated?" · last sync "+new Date(c.updated).toLocaleString([], {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"");
  } else {
    txt="Live from the InfoSec-maintained catalog Sheets (updates appear within 5 minutes)";
  }
  document.getElementById("foot").textContent=txt+" · Something new to request? Procurement queue in HappyFox.";
}

function setTab(t){state.tab=t;render();document.getElementById("q").focus();}

document.getElementById("tabs").addEventListener("click",function(e){
  var b=e.target.closest(".tab"); if(b) setTab(b.dataset.tab);
});
var qEl=document.getElementById("q");
qEl.addEventListener("input",function(){state.q=qEl.value;render();});
document.getElementById("clear").onclick=function(){qEl.value="";state.q="";render();qEl.focus();};
var chipsEl=document.getElementById("chips");
chipsEl.innerHTML=CHIPS.map(function(c){return '<button class="chip">'+c+"</button>";}).join("");
chipsEl.addEventListener("click",function(e){
  if(e.target.classList.contains("chip")){qEl.value=e.target.textContent;state.q=qEl.value;render();}
});

KEYS.forEach(load);
</script>
</body>
</html>
